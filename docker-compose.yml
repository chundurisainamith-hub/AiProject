version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ner_landslide_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ner_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ner_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ner_landslide_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ner_admin -d ner_landslide_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ner_landslide_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ner_admin:ner_secure_password_2026@db:5432/ner_landslide_db
      SECRET_KEY: ${SECRET_KEY:-supersecretjwtkeyfornerlandslideguardproductionuseonly}
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:80", "http://localhost"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
