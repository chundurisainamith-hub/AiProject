<style>

*{box-sizing:border-box}html,body{margin:0}
body{font-family:Manrope,'Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Malayalam','Noto Sans Kannada',system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 80% -10%,rgba(255,106,43,.14),transparent),linear-gradient(180deg,var(--bg),#070c16);min-height:100vh;line-height:1.5}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(10,18,32,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.04em}.brand i{color:var(--or);font-style:normal}

main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}

.btn{background:var(--or);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:800 14px Manrope;cursor:pointer;text-decoration:none;display:inline-block;margin:0 8px 8px 0}.btn.alt{background:var(--glass);border:1px solid var(--line)}

.f{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.f>*{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--soft);font-size:11px;text-transform:uppercase}.sc{overflow-x:auto}
.hero{padding:70px 8px 40px;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(180deg,#14233d,#0a1220)}
.hero svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:55%;opacity:.9}.hero>div{position:relative}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:0}.hero h1 span{color:var(--or)}.hero p{max-width:600px;color:var(--soft);font-size:17px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.note{font-size:12px;color:#facc15;margin:6px 0 14px}
#lg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 400px at 70% 0,rgba(255,106,43,.18),transparent),var(--bg);overflow:auto}#lg .card{width:100%;max-width:400px;margin:0}#lg input{margin:4px 0 12px}#le{min-height:20px;font-size:13px;font-weight:700;margin-bottom:8px}body.lock header,body.lock main{display:none}
#lt{display:flex;gap:4px;padding:3px;background:#0d1829;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}#lt button{flex:1;background:none;border:0;color:var(--soft);font:700 13px Manrope,sans-serif;padding:8px;border-radius:9px;cursor:pointer}#lt button.on{background:var(--or);color:#fff}
.lgc{display:flex;gap:4px;flex-wrap:wrap}.lgc button{background:var(--glass);border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:4px 9px;font:700 12px sans-serif;cursor:pointer}.lgc button.on{background:var(--or);color:#fff;border-color:var(--or)}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.hero{padding:40px 4px}}

<script>

const lv=s=>{const v=sc(s);return v<.3?0:v<.5?1:v<.7?2:3},pr=s=>Math.round(100/(1+Math.exp(-9*(sc(s)-.5))));

const tile=(k,v,s)=>`<div class="card" style="margin:0"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s||""}</div></div>`;
let CH=[],T,dS="All",mS="All",mR="All",sel=null,hS="All",hQ="",aL="All",adm=false,vb=[0,0,960,780],mQ="";
const sim=`<div class="note">Simulated demonstration data — not real sensor measurements or a validated AI prediction.</div>`;

function chart(id,type,data,o){CH.push(new Chart($(id),{type,data,options:Object.assign({responsive:true,color:"#9fb0c8",plugins:{legend:{labels:{color:"#9fb0c8"}}},scales:type==="doughnut"?{}:{x:{ticks:{color:"#9fb0c8"},grid:{color:"rgba(255,255,255,.06)"}},y:{ticks:{color:"#9fb0c8"},grid:{color:"rgba(255,255,255,.06)"}}}},o||{})}))}
const P={
home(){const hi=S.filter(s=>lv(s)>=2).length,al=S.filter(s=>lv(s)>=1).length;
return`<section class="hero"><svg viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0 300V190l120-70 110 60 140-110 130 90 150-100 160 120 120-70 150 80 120-60v270z" fill="#0f1c33"/><path d="M0 300V230l150-60 120 50 170-80 150 70 180-60 140 50 290-40v140z" fill="#0a1424"/></svg><div><h1>NER LANDSLIDE <span>GUARD</span></h1><p><b>AI-Powered Landslide Prediction and Early Warning System</b><br>Monitoring rainfall, soil saturation, slope movement and ground vibration across Assam, Arunachal Pradesh, Meghalaya, Manipur, Mizoram, Nagaland, Tripura and Sikkim.</p><a class="btn" href="#dashboard">Explore Dashboard</a><a class="btn alt" href="#map">View Risk Map</a><a class="btn alt" href="#response">Emergency Information</a></div></section>
<div class="g4" style="margin-top:18px">${tile("Monitored locations",S.length,"across 8 states")}${tile("High-risk zones",hi,"High + Critical")}${tile("Active warnings",al,"Moderate and above")}${tile("Rainfall stations",S.length,"simulated gauges")}</div>${sim}`},
dashboard(){const l=S.filter(s=>dS==="All"||s.state===dS),mx=Math.max(...l.map(lv),0),cnt=[0,1,2,3].map(i=>l.filter(s=>lv(s)===i).length),top=l.reduce((a,b)=>pr(b)>pr(a)?b:a,l[0]);
return`<h2>Dashboard</h2>${sim}<div class="f"><div><label>State</label><select onchange="dS=this.value;rr()">${["All",...ST].map(x=>`<option ${x===dS?"selected":""}>${x}</option>`).join("")}</select></div></div>
<div class="g4">${tile("Current risk",pill(mx),l.length+" stations")}${tile("Rainfall",avg(l,"rain").toFixed(0)+" mm","avg, last 24 h")}${tile("Soil moisture",avg(l,"soil").toFixed(0)+"%","average")}${tile("Ground vibration",avg(l,"vib").toFixed(1),"mm/s average")}${tile("Slope movement",avg(l,"tilt").toFixed(1)+"°","avg tilt")}${tile("Temperature",avg(l,"temp").toFixed(0)+"°C","average")}${tile("Humidity",avg(l,"hum").toFixed(0)+"%","average")}${tile("AI probability",top?pr(top)+"%":"–",top?top.name+" (demo)":"")}</div>
<div class="g2" style="margin-top:16px"><div class="card"><h3>Rainfall, last 7 days (mm)</h3><canvas id="c1"></canvas></div><div class="card"><h3>Risk distribution</h3><canvas id="c2"></canvas></div></div>
<div class="card"><h3>Recent warnings</h3>${l.filter(s=>lv(s)>=1).sort((a,b)=>lv(b)-lv(a)).slice(0,5).map((s,i)=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${pill(lv(s))} <b>${s.name}</b> · ${s.state} <span class="s">· ${(i+1)*7} min ago</span><div class="s">${ACT[lv(s)]}</div></div>`).join("")||"No active warnings."}</div>`},
map(){const l=S.filter(s=>(mS==="All"||s.state===mS)&&(mR==="All"||LV[lv(s)][0]===mR)&&s.name.toLowerCase().includes(mQ.toLowerCase()));
return`<h2>Live risk map</h2>${sim}<div class="f"><div><label>State</label><select onchange="mS=this.value;rr()">${["All",...ST].map(x=>`<option ${x===mS?"selected":""}>${x}</option>`).join("")}</select></div><div><label>Risk level</label><select onchange="mR=this.value;rr()">${["All",...LV.map(x=>x[0])].map(x=>`<option ${x===mR?"selected":""}>${x}</option>`).join("")}</select></div><div><label>Search station</label><input value="${mQ}" placeholder="e.g. Shillong" onchange="mQ=this.value;sel=null;rr()"></div></div>
<div class="g2" style="grid-template-columns:2fr 1fr"><div class="card"><svg id="ms" viewBox="${vb.join(" ")}" style="width:100%;border-radius:12px;background:#0b1626">${POLY.map(p=>{const c=p[1],cx=X(avg(c.map(a=>({v:a[0]})),"v")),cy=Y(avg(c.map(a=>({v:a[1]})),"v"));return`<polygon points="${c.map(a=>X(a[0])+","+Y(a[1])).join(" ")}" fill="rgba(90,130,190,.2)" stroke="#6d8fc0" stroke-width="2"/><text x="${cx}" y="${cy}" fill="#7f97b8" font-size="15" text-anchor="middle">${p[0]}</text>`}).join("")}${l.map(s=>`<circle cx="${X(s.lon)}" cy="${Y(s.lat)}" r="11" fill="${LV[lv(s)][1]}" stroke="#fff" stroke-width="2" style="cursor:pointer" onclick="pick('${s.name}')"/><text x="${X(s.lon)+14}" y="${Y(s.lat)+4}" fill="#eef3fb" font-size="13">${s.name}</text>`).join("")}</svg>
<div style="margin-top:8px"><button class="btn alt" onclick="zm(.7)">＋ Zoom in</button><button class="btn alt" onclick="zm(1.4)">－ Zoom out</button><button class="btn alt" onclick="vb=[0,0,960,780];rr()">Reset</button></div><div class="s">Schematic state outlines for demonstration. Production: Leaflet with OpenStreetMap tiles and official GeoJSON boundaries.</div></div>

predict(){return`<h2>AI prediction</h2><div class="note">Demonstration logic (weighted logistic formula), not a trained ML model. Ready to replace with a POST /api/predict call to a Python (scikit-learn Random Forest) backend.</div>
<div class="g2"><div class="card"><div class="g2" style="gap:10px"><div><label>Rainfall intensity (mm/h)</label><input id="p1" type="number" value="35"></div><div><label>Soil moisture (%)</label><input id="p2" type="number" value="70"></div><div><label>Slope angle (°)</label><input id="p3" type="number" value="30"></div><div><label>Soil type</label><select id="p4"><option>Clay</option><option>Silty loam</option><option>Sandy</option><option>Laterite</option><option>Rocky</option></select></div><div><label>Ground vibration (mm/s)</label><input id="p5" type="number" value="1.5"></div><div><label>Temperature (°C)</label><input id="p6" type="number" value="22"></div><div><label>7-day rainfall (mm)</label><input id="p7" type="number" value="280"></div></div><p><button class="btn" onclick="predict()">Predict risk</button></p></div><div class="card" id="po">Enter conditions and press Predict.</div></div>`},

'Normal conditions. Routine monitoring.':['सामान्य स्थिति। नियमित निगरानी।','இயல்பான நிலை. வழக்கமான கண்காணிப்பு.','సాధారణ పరిస్థితి. సాధారణ పర్యవేక్షణ.','സാധാരണ സാഹചര്യം. പതിവ് നിരീക്ഷണം.','ಸಾಮಾನ್ಯ ಸ್ಥಿತಿ. ನಿಯಮಿತ ಮೇಲ್ವಿಚಾರಣೆ.'],
'Increased monitoring required. Check slopes after rain.':['निगरानी बढ़ाएँ। बारिश के बाद ढलानों की जाँच करें।','கண்காணிப்பை அதிகரிக்கவும். மழைக்குப் பிறகு சரிவுகளைச் சரிபார்க்கவும்.','పర్యవేక్షణ పెంచండి. వర్షం తర్వాత వాలులను తనిఖీ చేయండి.','നിരീക്ഷണം വർധിപ്പിക്കുക. മഴയ്ക്കുശേഷം ചരിവുകൾ പരിശോധിക്കുക.','ಮೇಲ್ವಿಚಾರಣೆ ಹೆಚ್ಚಿಸಿ. ಮಳೆಯ ನಂತರ ಇಳಿಜಾರುಗಳನ್ನು ಪರಿಶೀಲಿಸಿ.'],
'Prepare for possible evacuation. Keep go-bags ready and avoid cut slopes.':['संभावित निकासी के लिए तैयार रहें। आपातकालीन बैग तैयार रखें और कटे ढलानों से बचें।','வெளியேற்றத்துக்குத் தயாராகுங்கள். அவசரப் பைகளைத் தயாராக வைத்து, வெட்டப்பட்ட சரிவுகளைத் தவிர்க்கவும்.','తరలింపునకు సిద్ధంగా ఉండండి. అత్యవసర బ్యాగులు సిద్ధంగా ఉంచి, కోసిన వాలులను నివారించండి.','ഒഴിപ്പിക്കലിന് തയ്യാറാകുക. അടിയന്തര ബാഗുകൾ തയ്യാറാക്കി വെട്ടിയ ചരിവുകൾ ഒഴിവാക്കുക.','ಸ್ಥಳಾಂತರಕ್ಕೆ ಸಿದ್ಧರಾಗಿ. ತುರ್ತು ಚೀಲಗಳನ್ನು ಸಿದ್ಧವಾಗಿಡಿ ಮತ್ತು ಕತ್ತರಿಸಿದ ಇಳಿಜಾರುಗಳನ್ನು ತಪ್ಪಿಸಿ.'],
'Immediate emergency response required. Evacuate unstable areas now.':['तत्काल आपातकालीन कार्रवाई आवश्यक। अस्थिर क्षेत्रों को अभी खाली करें।','உடனடி அவசர நடவடிக்கை தேவை. நிலையற்ற பகுதிகளை இப்போதே காலி செய்யுங்கள்.','తక్షణ అత్యవసర చర్య అవసరం. అస్థిర ప్రాంతాలను ఇప్పుడే ఖాళీ చేయండి.','ഉടൻ അടിയന്തര നടപടി ആവശ്യമാണ്. അസ്ഥിര പ്രദേശങ്ങൾ ഇപ്പോൾ തന്നെ ഒഴിയുക.','ತಕ್ಷಣದ ತುರ್ತು ಕ್ರಮ ಅಗತ್ಯ. ಅಸ್ಥಿರ ಪ್ರದೇಶಗಳನ್ನು ಈಗಲೇ ಖಾಲಿ ಮಾಡಿ.'],
